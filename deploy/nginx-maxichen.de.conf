# =====================================================================
#  LoveChat — nginx für maxichen.de
# ---------------------------------------------------------------------
#  Worauf es ankommt (aus V4.20 gelernt, mit Beleg dokumentiert):
#
#  🔴 Die Endungs-Regel MUSS vor jeder SPA-Regel greifen. Sonst liefert
#     `try_files $uri $uri/ /index.html` für eine fehlende .apk eine
#     HTML-Seite mit Status 200 — und der Nutzer lädt eine Datei namens
#     „app.apk" herunter, die in Wahrheit HTML ist.
#     Genau das stand in server.js:1872 als Fehler beschrieben.
#
#  Reihenfolge in nginx (wichtig!):
#     1. exakte/Endungs-Treffer  (location ~* \.(apk|...)$)
#     2. /downloads/
#     3. /chat/
#     4. /api/  und  /pair/     (Proxy)
#     5. location /             (zuletzt — SPA-Fallback)
# =====================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxichen.de www.maxichen.de;

    # --- TLS (Pfade ggf. anpassen) ---
    ssl_certificate     /etc/letsencrypt/live/maxichen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxichen.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/maxichen.de;
    index index.html;

    # --- Sicherheit (wie im Node-Server) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # =============================================================
    #  1. DOWNLOADS — die Endungsregel ZUERST
    # =============================================================
    #  try_files $uri =404  → existiert die Datei nicht, gibt es einen
    #  echten 404. KEIN HTML mit 200. Das ist der ganze Punkt.
    location ~* \.(apk|ipa|exe|msix|appx|dmg|zip|dll|7z|tar\.gz)$ {
        root /var/www/maxichen.de;
        try_files $uri =404;

        types {
            application/vnd.android.package-archive apk;
            application/octet-stream                  ipa exe msix appx dmg dll 7z;
            application/zip                           zip;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;

        # Downloads sollen nicht im Log stehen (nur Fehler)
        access_log off;
        error_log /var/log/nginx/lovechat-downloads-error.log warn;
    }

    # =============================================================
    #  2. /downloads/ — die schöne Seite
    # =============================================================
    location /downloads/ {
        alias /var/www/maxichen.de/downloads/;
        try_files $uri $uri/ /downloads/index.html;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # =============================================================
    #  3. /chat/ — die Web-Version
    # =============================================================
    location /chat/ {
        alias /var/www/maxichen.de/chat/;
        try_files $uri $uri/ /chat/index.html;
        index index.html;

        # Der Chat ist eine App: HTML nie cachen, JS kurz
        location ~* \.html$ { add_header Cache-Control "no-store" always; }
        location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=300" always; }
    }

    # /chat ohne Schrägstrich → mit Schrägstrich
    location = /chat { return 301 /chat/; }
    # /downloads ohne Schrägstrich → mit Schrägstrich
    location = /downloads { return 301 /downloads/; }

    # =============================================================
    #  4. API — Node auf :3900
    # =============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Live-Updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # =============================================================
    #  5. pair.js — WhatsApp-Verknüpfung (NIE öffentlich!)
    # =============================================================
    #  Nur von localhost erlaubt. 3100 ist ein interner Dienst.
    location /pair/ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # =============================================================
    #  6. location / — ZULETZT
    # =============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# WebSocket-Upgrade-Map (in den http-Block!)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name maxichen.de www.maxichen.de;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
